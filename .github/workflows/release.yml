name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Publish win-x64 release
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: write
      id-token: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate release tag
        run: |
          if ($env:GITHUB_REF_TYPE -ne "tag") {
            throw "Releases must run from a tag."
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Tag must be a SemVer-like value such as v1.2.3 or v1.2.3-rc.1."
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $stem = "BackdropForCodex-$($env:GITHUB_REF_NAME)-win-x64"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_STEM=$stem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The locked SBOM tool targets net8.0; 10.0.302 remains the exact build SDK.
          dotnet-version: |
            8.0.x
            10.0.302

      - name: Pin and verify release SDK
        run: |
          $configuration = Get-Content -LiteralPath .\global.json -Raw | ConvertFrom-Json
          $configuration.sdk.version = "10.0.302"
          $configuration.sdk.rollForward = "disable"
          $configuration | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath .\global.json -Encoding utf8NoBOM

          $actualSdk = dotnet --version
          if ($actualSdk -ne "10.0.302") {
            throw "Release requires .NET SDK 10.0.302 but resolved $actualSdk."
          }

      - name: Restore
        run: |
          dotnet restore .\BackdropForCodex.slnx --locked-mode
          dotnet tool restore

      - name: Build and verify release source
        run: >-
          dotnet build .\BackdropForCodex.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format .\BackdropForCodex.slnx --verify-no-changes --no-restore

      - name: Run non-integration tests
        run: >-
          dotnet test .\BackdropForCodex.slnx
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=Integration"

      - name: Publish self-contained single-file app
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          $publishArguments = @(
            "publish",
            ".\src\BackdropForCodex.App\BackdropForCodex.App.csproj",
            "--configuration", "Release",
            "--runtime", "win-x64",
            "--self-contained", "true",
            "--no-restore",
            "--output", $publishDir,
            "-p:ContinuousIntegrationBuild=true",
            "-p:Version=$($env:RELEASE_VERSION)",
            "-p:PublishSingleFile=true",
            "-p:PublishTrimmed=false",
            "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:DebugSymbols=false",
            "-p:DebugType=None"
          )
          & dotnet @publishArguments

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

          $publishedFiles = @(
            Get-ChildItem -LiteralPath $publishDir -File -Recurse
          )
          $publishedDirectories = @(
            Get-ChildItem -LiteralPath $publishDir -Directory -Recurse
          )
          if ($publishedFiles.Count -ne 1 -or
              $publishedFiles[0].Name -ne "BackdropForCodex.exe" -or
              $publishedFiles[0].DirectoryName -ne $publishDir -or
              $publishedDirectories.Count -ne 0) {
            throw "Expected exactly one BackdropForCodex.exe publish artifact."
          }

          Copy-Item -LiteralPath @(
            "LICENSE",
            "NOTICE",
            "PRIVACY.md",
            "SECURITY.md",
            "THREAT_MODEL.md",
            "THIRD_PARTY_NOTICES.md"
          ) -Destination $publishDir

          $licenseDir = Join-Path $publishDir "licenses"
          New-Item -ItemType Directory -Path $licenseDir -Force | Out-Null
          $nugetRoot = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          }
          else {
            Join-Path $env:USERPROFILE ".nuget\packages"
          }

          $noticeFiles = @(
            @{ Package = "microsoft.netcore.app.runtime.win-x64"; Version = "10.0.10"; Source = "LICENSE.TXT"; Destination = "dotnet-runtime-LICENSE.txt" },
            @{ Package = "microsoft.netcore.app.runtime.win-x64"; Version = "10.0.10"; Source = "THIRD-PARTY-NOTICES.TXT"; Destination = "dotnet-runtime-THIRD-PARTY-NOTICES.txt" },
            @{ Package = "microsoft.windowsdesktop.app.runtime.win-x64"; Version = "10.0.10"; Source = "LICENSE"; Destination = "windowsdesktop-LICENSE.txt" },
            @{ Package = "wpf-ui"; Version = "4.3.0"; Source = "LICENSE.md"; Destination = "wpf-ui-LICENSE.md" },
            @{ Package = "wpf-ui"; Version = "4.3.0"; Source = "ThirdPartyNotices.txt"; Destination = "wpf-ui-THIRD-PARTY-NOTICES.txt" },
            @{ Package = "wpf-ui.tray"; Version = "4.3.0"; Source = "LICENSE.md"; Destination = "wpf-ui-tray-LICENSE.md" },
            @{ Package = "wpf-ui.tray"; Version = "4.3.0"; Source = "ThirdPartyNotices.txt"; Destination = "wpf-ui-tray-THIRD-PARTY-NOTICES.txt" },
            @{ Package = "communitytoolkit.mvvm"; Version = "8.4.2"; Source = "License.md"; Destination = "communitytoolkit-mvvm-LICENSE.md" },
            @{ Package = "communitytoolkit.mvvm"; Version = "8.4.2"; Source = "ThirdPartyNotices.txt"; Destination = "communitytoolkit-mvvm-THIRD-PARTY-NOTICES.txt" },
            @{ Package = "microsoft.extensions.logging.abstractions"; Version = "8.0.0"; Source = "LICENSE.TXT"; Destination = "microsoft-extensions-logging-abstractions-LICENSE.txt" },
            @{ Package = "microsoft.extensions.logging.abstractions"; Version = "8.0.0"; Source = "THIRD-PARTY-NOTICES.TXT"; Destination = "microsoft-extensions-logging-abstractions-THIRD-PARTY-NOTICES.txt" }
          )

          foreach ($notice in $noticeFiles) {
            $packageRoot = Join-Path $nugetRoot $notice.Package
            if ($notice.ContainsKey("Version")) {
              $versionDirectory = Get-Item -LiteralPath (Join-Path $packageRoot $notice.Version) -ErrorAction Stop
              if (-not (Test-Path -LiteralPath (Join-Path $versionDirectory.FullName $notice.Source) -PathType Leaf)) {
                throw "Required upstream notice was not restored: $($notice.Package)/$($notice.Version)/$($notice.Source)"
              }
            }
            else {
              $versionDirectory = @(
                Get-ChildItem -LiteralPath $packageRoot -Directory -ErrorAction Stop |
                  Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName $notice.Source) -PathType Leaf } |
                  Sort-Object LastWriteTimeUtc -Descending
              ) | Select-Object -First 1
            }
            if ($null -eq $versionDirectory) {
              throw "Required upstream notice was not restored: $($notice.Package)/$($notice.Source)"
            }

            Copy-Item -LiteralPath (Join-Path $versionDirectory.FullName $notice.Source) -Destination (Join-Path $licenseDir $notice.Destination)
          }

          $vendoredNoticeFiles = @(
            @{ Source = "third_party\licenses\PuppeteerSharp-25.3.4-LICENSE.txt"; Destination = "puppeteersharp-LICENSE.txt" },
            @{ Source = "third_party\licenses\WebDriverBiDi-0.0.54-LICENSE.txt"; Destination = "webdriverbidi-LICENSE.txt" },
            @{ Source = "third_party\licenses\Microsoft.IO.RecyclableMemoryStream-3.0.1-LICENSE.txt"; Destination = "microsoft-io-recyclablememorystream-LICENSE.txt" }
          )
          foreach ($notice in $vendoredNoticeFiles) {
            if (-not (Test-Path -LiteralPath $notice.Source -PathType Leaf)) {
              throw "Required vendored upstream license is missing: $($notice.Source)"
            }

            Copy-Item -LiteralPath $notice.Source -Destination (Join-Path $licenseDir $notice.Destination)
          }

      - name: Generate and validate SPDX 2.2 SBOM
        run: |
          $publishDir = (Resolve-Path -LiteralPath "artifacts\publish").Path
          $sbomPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\$($env:ARTIFACT_STEM).spdx.json"
          $generateArguments = @(
            "tool", "run", "sbom-tool", "generate",
            "-b", $publishDir,
            "-bc", (Join-Path $env:GITHUB_WORKSPACE "src"),
            "-pn", "Backdrop for Codex",
            "-pv", $env:RELEASE_VERSION,
            "-ps", "Organization:TogawaSakiko-desuwa",
            "-nsb", "https://github.com/$($env:GITHUB_REPOSITORY)",
            "-mi", "SPDX:2.2",
            "-V", "Information"
          )
          & dotnet @generateArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft SBOM Tool generation failed."
          }

          $generatedSbom = Join-Path $publishDir "_manifest\spdx_2.2\manifest.spdx.json"
          if (-not (Test-Path -LiteralPath $generatedSbom -PathType Leaf)) {
            throw "Microsoft SBOM Tool did not produce the expected manifest."
          }

          $validationOutput = Join-Path $env:RUNNER_TEMP "backdrop-for-codex-sbom-validation.json"
          $validateArguments = @(
            "tool", "run", "sbom-tool", "validate",
            "-b", $publishDir,
            "-o", $validationOutput,
            "-mi", "SPDX:2.2",
            "-V", "Error"
          )
          & dotnet @validateArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft SBOM Tool validation failed."
          }

          $sbom = Get-Content -LiteralPath $generatedSbom -Raw -Encoding utf8 | ConvertFrom-Json
          $lock = Get-Content -LiteralPath "src\BackdropForCodex.App\packages.lock.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $framework = $lock.dependencies.PSObject.Properties |
            Where-Object { $_.Name -notmatch '/' } |
            Select-Object -First 1
          if ($null -eq $framework) {
            throw "The app lock file does not contain a framework dependency group."
          }

          $requiredPackages = [ordered]@{}
          foreach ($dependency in $framework.Value.PSObject.Properties) {
            if ($dependency.Value.type -eq "Project" -or
                [string]::IsNullOrWhiteSpace($dependency.Value.resolved)) {
              continue
            }

            $requiredPackages[$dependency.Name] = [string]$dependency.Value.resolved
          }
          $requiredPackages["Microsoft.NETCore.App.Runtime.win-x64"] = "10.0.10"
          $requiredPackages["Microsoft.WindowsDesktop.App.Runtime.win-x64"] = "10.0.10"

          foreach ($requiredPackage in $requiredPackages.GetEnumerator()) {
            $matches = @(
              $sbom.packages |
                Where-Object { $_.name -ieq $requiredPackage.Key }
            )
            if ($matches.Count -eq 0) {
              throw "SBOM is missing required component: $($requiredPackage.Key)"
            }
            if ($matches.Count -ne 1 -or
                $matches[0].versionInfo -ne $requiredPackage.Value) {
              throw "SBOM has no $($requiredPackage.Key) version $($requiredPackage.Value)."
            }
          }

          Copy-Item -LiteralPath $generatedSbom -Destination $sbomPath

      - name: Archive and calculate SHA-256
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\$($env:ARTIFACT_STEM).zip"
          $sbomPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\$($env:ARTIFACT_STEM).spdx.json"
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\BackdropForCodex-$($env:GITHUB_REF_NAME)-SHA256SUMS.txt"

          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $checksumLines = foreach ($path in @($zipPath, $sbomPath)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([IO.Path]::GetFileName($path))"
          }
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ github.workspace }}/artifacts/BackdropForCodex-${{ github.ref_name }}-win-x64.zip

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ github.workspace }}/artifacts/BackdropForCodex-${{ github.ref_name }}-win-x64.zip
          sbom-path: ${{ github.workspace }}/artifacts/BackdropForCodex-${{ github.ref_name }}-win-x64.spdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            Join-Path $env:GITHUB_WORKSPACE "artifacts\$($env:ARTIFACT_STEM).zip"
            Join-Path $env:GITHUB_WORKSPACE "artifacts\$($env:ARTIFACT_STEM).spdx.json"
            Join-Path $env:GITHUB_WORKSPACE "artifacts\BackdropForCodex-$($env:GITHUB_REF_NAME)-SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected release asset is missing: $([IO.Path]::GetFileName($asset))"
            }
          }

          $unexpectedAssets = @(
            Get-ChildItem -LiteralPath "artifacts" -File |
              Where-Object FullName -NotIn $assets
          )
          if ($unexpectedAssets.Count -ne 0) {
            throw "Unexpected top-level release assets are present: $($unexpectedAssets.Name -join ', ')"
          }

          $ErrorActionPreference = "SilentlyContinue"
          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"

          if ($releaseExists) {
            throw "Release $tag already exists. Published assets are immutable; create a new tag."
          }

          $releaseArguments = @(
            "release", "create", $tag
          ) + $assets + @(
            "--verify-tag",
            "--title", "Backdrop for Codex $tag",
            "--generate-notes"
          )
          if ($tag -match '-') {
            $releaseArguments += "--prerelease"
          }
          gh @releaseArguments

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release command failed."
          }
