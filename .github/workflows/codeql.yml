name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "27 17 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Pin and verify analysis SDK
        run: |
          $configuration = Get-Content -LiteralPath .\global.json -Raw | ConvertFrom-Json
          $configuration.sdk.version = "10.0.302"
          $configuration.sdk.rollForward = "disable"
          $configuration | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath .\global.json -Encoding utf8NoBOM

          $actualSdk = dotnet --version
          if ($actualSdk -ne "10.0.302") {
            throw "CodeQL build requires .NET SDK 10.0.302 but resolved $actualSdk."
          }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore .\BackdropForCodex.slnx --locked-mode

      - name: Build
        run: dotnet build .\BackdropForCodex.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: /language:csharp
